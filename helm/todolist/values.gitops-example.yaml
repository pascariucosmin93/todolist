images:
  backend:
    repository: ghcr.io/pascariucosmin93/todo-backend
    tag: "0.0.1"
  frontend:
    repository: ghcr.io/pascariucosmin93/todo-frontend
    tag: "0.0.1"

backend:
  corsOrigins:
    - "https://todo.example.internal"

frontend:
  service:
    type: LoadBalancer
    annotations: {}
    loadBalancerIP: ""
    externalTrafficPolicy: Cluster
  runtimeConfig:
    apiUrl: "https://api.todo.example.internal/api/v1"

externalPostgres:
  enabled: false
  host: ""
  port: 5432
  bootstrapDatabase: "postgres"
  auth:
    database: "todolist"
    username: "devops"
    password: "devops"

ingress:
  enabled: true
  className: nginx
  hosts:
    frontend: todo.example.internal
    backend: api.todo.example.internal

postgres:
  auth:
    existingSecret: "todolist-postgres"
