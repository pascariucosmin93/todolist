services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      CORS_ORIGINS: http://localhost:${FRONTEND_PORT}
    ports:
      - "${BACKEND_PORT}:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${FRONTEND_API_URL}
        VITE_AUTH_AUTHORITY: ${FRONTEND_AUTH_AUTHORITY}
        VITE_AUTH_CLIENT_ID: ${FRONTEND_AUTH_CLIENT_ID}
        VITE_AUTH_REDIRECT_URI: ${FRONTEND_AUTH_REDIRECT_URI}
        VITE_AUTH_POST_LOGOUT_REDIRECT_URI: ${FRONTEND_AUTH_POST_LOGOUT_REDIRECT_URI}
    environment:
      VITE_API_URL: ${FRONTEND_API_URL}
      VITE_AUTH_AUTHORITY: ${FRONTEND_AUTH_AUTHORITY}
      VITE_AUTH_CLIENT_ID: ${FRONTEND_AUTH_CLIENT_ID}
      VITE_AUTH_REDIRECT_URI: ${FRONTEND_AUTH_REDIRECT_URI}
      VITE_AUTH_POST_LOGOUT_REDIRECT_URI: ${FRONTEND_AUTH_POST_LOGOUT_REDIRECT_URI}
    ports:
      - "${FRONTEND_PORT}:80"
    depends_on:
      - backend

volumes:
  postgres_data:
