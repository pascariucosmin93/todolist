name: CI

"on":
  push:
    branches:
      - main
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: pip install -r requirements.txt

      - name: Run backend tests
        env:
          PYTHONPATH: "."
          DATABASE_URL: "sqlite+pysqlite:///:memory:"
          OIDC_ISSUER_URL: "https://auth.todo.local/application/o/todo-app/"
          OIDC_JWKS_URL: "https://auth.todo.local/application/o/todo-app/jwks/"
          OIDC_CLIENT_ID: "todo-frontend"
        run: pytest

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Install frontend dependencies
        run: npm install

      - name: Build frontend
        env:
          VITE_API_URL: "https://api.todo.local/api/v1"
          VITE_AUTH_AUTHORITY: "https://auth.todo.local/application/o/todo-app/"
          VITE_AUTH_CLIENT_ID: "todo-frontend"
          VITE_AUTH_REDIRECT_URI: "https://todo.local/"
          VITE_AUTH_POST_LOGOUT_REDIRECT_URI: "https://todo.local/"
        run: npm run build

  helm-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4

      - name: Lint chart
        run: helm lint helm/todolist

      - name: Render chart
        run: helm template todo helm/todolist -f helm/todolist/values.gitops-example.yaml >/tmp/rendered.yaml
