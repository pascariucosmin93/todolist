name: Build & Push to GHCR

"on":
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "frontend/**"
      - "helm/todolist/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  GITOPS_REPO: https://github.com/pascariucosmin93/todolist-giops.git

jobs:
  build-test-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run backend tests
        working-directory: backend
        env:
          PYTHONPATH: "."
          DATABASE_URL: "sqlite+pysqlite:///:memory:"
          OIDC_ISSUER_URL: "https://auth.todo.local/application/o/todo-app/"
          OIDC_JWKS_URL: "https://auth.todo.local/application/o/todo-app/jwks/"
          OIDC_CLIENT_ID: "todo-frontend"
        run: pytest

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_URL: "https://api.todo.local/api/v1"
          VITE_AUTH_AUTHORITY: "https://auth.todo.local/application/o/todo-app/"
          VITE_AUTH_CLIENT_ID: "todo-frontend"
          VITE_AUTH_REDIRECT_URI: "https://todo.local/"
          VITE_AUTH_POST_LOGOUT_REDIRECT_URI: "https://todo.local/"
        run: npm run build

      - uses: azure/setup-helm@v4

      - name: Lint chart
        run: helm lint helm/todolist

      - name: Render chart
        run: helm template todo helm/todolist -f helm/todolist/values.gitops-example.yaml >/tmp/rendered.yaml

      - name: Set version metadata
        id: vars
        run: |
          echo "short_sha=${GITHUB_SHA::6}" >> "$GITHUB_OUTPUT"
          echo "dev_version=0.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image names
        id: img
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "backend=ghcr.io/$OWNER/todo-backend" >> "$GITHUB_OUTPUT"
          echo "frontend=ghcr.io/$OWNER/todo-frontend" >> "$GITHUB_OUTPUT"

      - name: Build backend image
        run: |
          docker build \
            -t ${{ steps.img.outputs.backend }}:${{ steps.vars.outputs.short_sha }} \
            -t ${{ steps.img.outputs.backend }}:${{ steps.vars.outputs.dev_version }} \
            ./backend

      - name: Build frontend image
        run: |
          docker build \
            --build-arg VITE_API_URL=https://api.todo.example.internal/api/v1 \
            --build-arg VITE_AUTH_AUTHORITY=https://auth.todo.example.internal/application/o/todo-app/ \
            --build-arg VITE_AUTH_CLIENT_ID=todo-frontend \
            --build-arg VITE_AUTH_REDIRECT_URI=https://todo.example.internal/ \
            --build-arg VITE_AUTH_POST_LOGOUT_REDIRECT_URI=https://todo.example.internal/ \
            -t ${{ steps.img.outputs.frontend }}:${{ steps.vars.outputs.short_sha }} \
            -t ${{ steps.img.outputs.frontend }}:${{ steps.vars.outputs.dev_version }} \
            ./frontend

      - name: Push backend tags
        run: |
          docker push ${{ steps.img.outputs.backend }}:${{ steps.vars.outputs.short_sha }}
          docker push ${{ steps.img.outputs.backend }}:${{ steps.vars.outputs.dev_version }}

      - name: Push frontend tags
        run: |
          docker push ${{ steps.img.outputs.frontend }}:${{ steps.vars.outputs.short_sha }}
          docker push ${{ steps.img.outputs.frontend }}:${{ steps.vars.outputs.dev_version }}

      - name: Update todolist-giops image tags
        env:
          DEV_VERSION: ${{ steps.vars.outputs.dev_version }}
          IMAGE_OWNER: ${{ github.repository_owner }}
          GITOPS_PUSH_USER: ${{ secrets.GITOPS_PUSH_USER }}
          GITOPS_PUSH_TOKEN: ${{ secrets.GITOPS_PUSH_TOKEN }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "${GITOPS_PUSH_USER:-}" ] || [ -z "${GITOPS_PUSH_TOKEN:-}" ]; then
            echo "GITOPS_PUSH_USER / GITOPS_PUSH_TOKEN not set; skipping todolist-giops update."
            exit 0
          fi

          AUTH_REPO=$(echo "$GITOPS_REPO" | sed "s#https://#https://${GITOPS_PUSH_USER}:${GITOPS_PUSH_TOKEN}@#")
          WORKDIR=$(mktemp -d)

          git clone "$AUTH_REPO" "$WORKDIR/gitops"
          cd "$WORKDIR/gitops"

          ruby <<'RUBY'
          require "yaml"

          values_path = "k8s/chart/values.yaml"
          values = YAML.load_file(values_path)

          owner = ENV.fetch("IMAGE_OWNER").downcase
          values["images"]["backend"]["repository"] = "ghcr.io/#{owner}/todo-backend"
          values["images"]["frontend"]["repository"] = "ghcr.io/#{owner}/todo-frontend"
          values["images"]["backend"]["tag"] = ENV.fetch("DEV_VERSION")
          values["images"]["frontend"]["tag"] = ENV.fetch("DEV_VERSION")

          values["secrets"]["create"] = true
          values["postgres"]["auth"]["database"] = ENV.fetch("POSTGRES_DB")
          values["postgres"]["auth"]["username"] = ENV.fetch("POSTGRES_USER")
          values["postgres"]["auth"]["password"] = ENV.fetch("POSTGRES_PASSWORD")
          values["postgres"]["auth"]["existingSecret"] = ""

          File.write(values_path, values.to_yaml(line_width: -1))
          RUBY

          if git diff --quiet -- k8s/chart/values.yaml; then
            echo "todolist-giops already up-to-date"
            exit 0
          fi

          git config user.name "Todolist CI Bot"
          git config user.email "todolist-ci-bot@users.noreply.github.com"
          git add k8s/chart/values.yaml
          git commit -m "chore(gitops): deploy dev version ${DEV_VERSION}"
          git push origin main
