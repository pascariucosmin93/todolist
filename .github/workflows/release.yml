name: Release

"on":
  workflow_dispatch:
    inputs:
      version:
        description: Docker image version to build and publish
        required: true
        default: "0.0.1"

permissions:
  contents: read
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/todo-backend:${{ github.event.inputs.version }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: |
            VITE_API_URL=https://api.todo.example.internal/api/v1
            VITE_KEYCLOAK_URL=https://auth.todo.example.internal/auth
            VITE_KEYCLOAK_REALM=todo-app
            VITE_KEYCLOAK_CLIENT_ID=todo-frontend
          tags: ghcr.io/${{ github.repository_owner }}/todo-frontend:${{ github.event.inputs.version }}

