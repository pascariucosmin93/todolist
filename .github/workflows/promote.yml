name: Promote

"on":
  workflow_dispatch:
    inputs:
      source_tag:
        description: Existing source tag to promote, for example 0.0.42
        required: true
        type: string
      release_version:
        description: Release version, for example 1.0.0
        required: true
        type: string
      update_gitops:
        description: Also update todolist-giops to the promoted release
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  GITOPS_REPO: https://github.com/pascariucosmin93/todolist-giops.git

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate release version
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          if ! [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release_version must match x.y.z"
            exit 1
          fi

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image names
        id: img
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "backend=ghcr.io/$OWNER/todo-backend" >> "$GITHUB_OUTPUT"
          echo "frontend=ghcr.io/$OWNER/todo-frontend" >> "$GITHUB_OUTPUT"

      - name: Promote image tags
        env:
          SOURCE_TAG: ${{ inputs.source_tag }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          BACKEND_IMAGE: ${{ steps.img.outputs.backend }}
          FRONTEND_IMAGE: ${{ steps.img.outputs.frontend }}
        run: |
          set -euo pipefail

          MAJOR="${RELEASE_VERSION%%.*}"
          MINOR="${RELEASE_VERSION%.*}"

          for IMAGE in "$BACKEND_IMAGE" "$FRONTEND_IMAGE"; do
            docker pull "$IMAGE:$SOURCE_TAG"
            docker tag "$IMAGE:$SOURCE_TAG" "$IMAGE:$RELEASE_VERSION"
            docker tag "$IMAGE:$SOURCE_TAG" "$IMAGE:$MAJOR"
            docker tag "$IMAGE:$SOURCE_TAG" "$IMAGE:$MINOR"
            docker tag "$IMAGE:$SOURCE_TAG" "$IMAGE:latest"

            docker push "$IMAGE:$RELEASE_VERSION"
            docker push "$IMAGE:$MAJOR"
            docker push "$IMAGE:$MINOR"
            docker push "$IMAGE:latest"
          done

      - name: Clone GitOps repository
        if: ${{ inputs.update_gitops }}
        env:
          GITOPS_PUSH_USER: ${{ secrets.GITOPS_PUSH_USER }}
          GITOPS_PUSH_TOKEN: ${{ secrets.GITOPS_PUSH_TOKEN }}
        run: |
          REPO_NO_SCHEME="${GITOPS_REPO#https://}"
          git clone "https://${GITOPS_PUSH_USER}:${GITOPS_PUSH_TOKEN}@${REPO_NO_SCHEME}" /tmp/todolist-gitops
          git -C /tmp/todolist-gitops checkout main

      - name: Update todolist-giops to promoted version
        if: ${{ inputs.update_gitops }}
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          export VALUES_FILE="/tmp/todolist-gitops/k8s/chart/values.yaml"
          ruby <<'RUBY'
          require "yaml"

          values_file = ENV.fetch("VALUES_FILE")
          values = YAML.load_file(values_file)

          values["images"]["backend"]["tag"] = ENV.fetch("RELEASE_VERSION")
          values["images"]["frontend"]["tag"] = ENV.fetch("RELEASE_VERSION")

          values["secrets"]["create"] = true

          values["postgres"]["auth"]["database"] = ENV.fetch("POSTGRES_DB")
          values["postgres"]["auth"]["username"] = ENV.fetch("POSTGRES_USER")
          values["postgres"]["auth"]["password"] = ENV.fetch("POSTGRES_PASSWORD")
          values["postgres"]["auth"]["existingSecret"] = ""

          File.write(values_file, values.to_yaml(line_width: -1))
          RUBY
        shell: bash

      - name: Commit and push GitOps changes
        if: ${{ inputs.update_gitops }}
        env:
          VERSION: ${{ inputs.release_version }}
        run: |
          git -C /tmp/todolist-gitops config user.name "github-actions[bot]"
          git -C /tmp/todolist-gitops config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C /tmp/todolist-gitops add k8s/chart/values.yaml
          git -C /tmp/todolist-gitops commit -m "chore(gitops): promote release ${VERSION}" || exit 0
          git -C /tmp/todolist-gitops push origin main
