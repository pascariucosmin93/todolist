name: Promote

on:
  workflow_dispatch:
    inputs:
      version:
        description: Docker image version to build and promote
        required: true
        default: "1.0.0"
      gitops_repo:
        description: GitOps repository clone URL
        required: true
        default: "https://github.com/pascariucosmin93/todolist-giops.git"
      gitops_branch:
        description: GitOps target branch
        required: true
        default: "main"
      gitops_path:
        description: Path inside the GitOps repo for this app
        required: true
        default: "apps/todolist"

permissions:
  contents: write
  packages: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read source version
        id: source_version
        run: echo "value=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - name: Validate version progression
        run: |
          echo "Current version: ${{ steps.source_version.outputs.value }}"
          echo "Promoted version: ${{ github.event.inputs.version }}"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/todo-backend:${{ github.event.inputs.version }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: |
            VITE_API_URL=https://api.todo.example.internal/api/v1
            VITE_KEYCLOAK_URL=https://auth.todo.example.internal/auth
            VITE_KEYCLOAK_REALM=todo-app
            VITE_KEYCLOAK_CLIENT_ID=todo-frontend
          tags: ghcr.io/${{ github.repository_owner }}/todo-frontend:${{ github.event.inputs.version }}

      - name: Clone GitOps repository
        env:
          GITOPS_PUSH_USER: ${{ secrets.GITOPS_PUSH_USER }}
          GITOPS_PUSH_TOKEN: ${{ secrets.GITOPS_PUSH_TOKEN }}
          GITOPS_REPO: ${{ github.event.inputs.gitops_repo }}
        run: |
          REPO_NO_SCHEME="${GITOPS_REPO#https://}"
          git clone "https://${GITOPS_PUSH_USER}:${GITOPS_PUSH_TOKEN}@${REPO_NO_SCHEME}" /tmp/todolist-gitops
          git -C /tmp/todolist-gitops checkout "${{ github.event.inputs.gitops_branch }}"

      - name: Ensure target path exists
        run: mkdir -p "/tmp/todolist-gitops/${{ github.event.inputs.gitops_path }}"

      - name: Copy Helm chart into GitOps repo
        run: rsync -a helm/todolist/ "/tmp/todolist-gitops/${{ github.event.inputs.gitops_path }}/"

      - name: Update promoted image versions
        run: |
          perl -0pi -e 's|(backend:\n\s+repository:.*\n\s+tag: )"[^"]*"|${1}"'"${{ github.event.inputs.version }}"'"|g' "/tmp/todolist-gitops/${{ github.event.inputs.gitops_path }}/values.yaml"
          perl -0pi -e 's|(frontend:\n\s+repository:.*\n\s+tag: )"[^"]*"|${1}"'"${{ github.event.inputs.version }}"'"|g' "/tmp/todolist-gitops/${{ github.event.inputs.gitops_path }}/values.yaml"

      - name: Commit and push GitOps changes
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: |
          git -C /tmp/todolist-gitops config user.name "github-actions[bot]"
          git -C /tmp/todolist-gitops config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C /tmp/todolist-gitops add .
          git -C /tmp/todolist-gitops commit -m "Promote todolist to ${VERSION}" || exit 0
          git -C /tmp/todolist-gitops push origin "${{ github.event.inputs.gitops_branch }}"
