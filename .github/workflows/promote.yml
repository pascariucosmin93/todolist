name: Promote

"on":
  workflow_dispatch:
    inputs:
      version:
        description: Image version to promote in GitOps
        required: true
        default: "1.0.0"
      gitops_repo:
        description: GitOps repository clone URL
        required: true
        default: "https://github.com/pascariucosmin93/todolist-giops.git"
      gitops_branch:
        description: GitOps target branch
        required: true
        default: "main"
      gitops_path:
        description: Path inside the GitOps repo for this app
        required: true
        default: "k8s/chart"

permissions:
  contents: read

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clone GitOps repository
        env:
          GITOPS_PUSH_USER: ${{ secrets.GITOPS_PUSH_USER }}
          GITOPS_PUSH_TOKEN: ${{ secrets.GITOPS_PUSH_TOKEN }}
          GITOPS_REPO: ${{ github.event.inputs.gitops_repo }}
        run: |
          REPO_NO_SCHEME="${GITOPS_REPO#https://}"
          git clone "https://${GITOPS_PUSH_USER}:${GITOPS_PUSH_TOKEN}@${REPO_NO_SCHEME}" /tmp/todolist-gitops
          git -C /tmp/todolist-gitops checkout "${{ github.event.inputs.gitops_branch }}"

      - name: Update GitOps values with promoted version and runtime secrets
        env:
          VERSION: ${{ github.event.inputs.version }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          KEYCLOAK_ADMIN: ${{ secrets.KEYCLOAK_ADMIN }}
          KEYCLOAK_ADMIN_PASSWORD: ${{ secrets.KEYCLOAK_ADMIN_PASSWORD }}
        run: |
          export VALUES_FILE="/tmp/todolist-gitops/${{ github.event.inputs.gitops_path }}/values.yaml"
          ruby <<'RUBY'
          require "yaml"

          values_file = ENV.fetch("VALUES_FILE")
          values = YAML.load_file(values_file)

          values["images"]["backend"]["tag"] = ENV.fetch("VERSION")
          values["images"]["frontend"]["tag"] = ENV.fetch("VERSION")

          values["secrets"]["create"] = true

          values["postgres"]["auth"]["database"] = ENV.fetch("POSTGRES_DB")
          values["postgres"]["auth"]["username"] = ENV.fetch("POSTGRES_USER")
          values["postgres"]["auth"]["password"] = ENV.fetch("POSTGRES_PASSWORD")
          values["postgres"]["auth"]["existingSecret"] = ""

          values["keycloak"]["admin"]["user"] = ENV.fetch("KEYCLOAK_ADMIN")
          values["keycloak"]["admin"]["password"] = ENV.fetch("KEYCLOAK_ADMIN_PASSWORD")
          values["keycloak"]["admin"]["existingSecret"] = ""

          File.write(values_file, values.to_yaml(line_width: -1))
          RUBY
        shell: bash

      - name: Commit and push GitOps changes
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: |
          git -C /tmp/todolist-gitops config user.name "github-actions[bot]"
          git -C /tmp/todolist-gitops config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C /tmp/todolist-gitops add .
          git -C /tmp/todolist-gitops commit -m "Promote todolist to ${VERSION}" || exit 0
          git -C /tmp/todolist-gitops push origin "${{ github.event.inputs.gitops_branch }}"
